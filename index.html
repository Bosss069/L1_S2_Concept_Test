<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Concept Test - Session 2</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Fredoka,'Comic Sans MS','Chalkboard SE',sans-serif;min-height:100vh;background:#fff;color:#222;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.c{max-width:900px;margin:auto;padding:30px 20px}
.brand{text-align:center;margin-bottom:25px}
.brand h1{font-size:48px;font-weight:700;line-height:1.2}.brand span{color:#b266ff}.brand p{margin-top:12px;font-size:18px;color:#666}
.logo{display:block;width:162px;max-width:70%;height:auto;margin:0 auto 18px}.ls{width:120px;margin:25px auto 0}
.card{background:#fff;border:1px solid #e5e7eb;padding:30px;border-radius:28px;margin-bottom:25px;box-shadow:0 4px 20px rgba(0,0,0,.08);animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;padding:18px 25px;border-radius:20px;border:1px solid #e5e7eb;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:28px;font-weight:700;margin-bottom:25px;text-align:center}
.qi{display:block;max-height:none;margin:0 auto 22px;max-width:100%;height:auto;border-radius:12px;border:1px solid #e5e7eb;background:#fff}
button{cursor:pointer;border:0;transition:.3s;font-family:inherit}
.o{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;margin-bottom:12px;background:#f9fafb;border:1px solid #d1d5db;color:#222;border-radius:15px;font-size:16px;text-align:left}
.o:hover:not(:disabled){background:#8b3dff;color:#fff;transform:translateX(5px)}
.o b{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #9ca3af;display:grid;place-items:center;font-size:14px}
.o:hover:not(:disabled) b,.ok b,.no b{border-color:#fff}
.o.ok{background:#00c853;color:#fff}.o.no{background:#ff1744;color:#fff}
.o:focus-visible,.p:focus-visible{outline:3px solid #8b3dff;outline-offset:2px}
.p{background:linear-gradient(45deg,#8b3dff,#c55fff);padding:16px 28px;color:#fff;border-radius:14px;font-weight:700;font-size:17px;display:none;margin:15px 0 0 auto}
.p:hover{transform:scale(1.05);box-shadow:0 4px 14px rgba(139,61,255,.35)}
#r{display:none;text-align:center}#r h2{font-size:42px;margin-bottom:15px}#r p{font-size:28px}
.badge{font-size:32px;margin-top:20px}.fb{text-align:center;margin-top:20px;color:#8b3dff;font-weight:700}
</style></head><body><div class="c">
